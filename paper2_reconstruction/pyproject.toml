[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/paper2"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "paper2.documents"
disallow_untyped_calls = false
